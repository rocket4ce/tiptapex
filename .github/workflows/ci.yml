name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: mix test (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - elixir: "1.17"
            otp: "27"
          - elixir: "1.19"
            otp: "28"
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ matrix.elixir }}-${{ hashFiles('mix.lock') }}
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test

  js-smoke:
    name: esbuild bundle smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19"
          otp-version: "28"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            dev/assets/node_modules
          key: js-smoke-${{ hashFiles('mix.lock', 'dev/assets/package.json') }}
      - run: mix deps.get
      - run: npm install --prefix dev/assets
      # Bundling the demo app proves the ESM entry points compile and every
      # export resolves against the installed @tiptap peers.
      - run: mix dev.assets
      # Pure-logic JS checks: page normalisation (must agree with
      # Tiptapex.Page) and the pagination maths.
      - run: mix js.test
